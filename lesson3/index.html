<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Практика по таблицам</title>
  </head>
  <body>
    <table class="table">
      <caption class="title">
        Июнь 2025
      </caption>
      <thead>
        <tr>
          <th>ПН</th>
          <th>ВТ</th>
          <th>СР</th>
          <th>ЧТ</th>
          <th>ПТ</th>
          <th class="weekend">СБ</th>
          <th class="weekend">ВС</th>
        </tr>
      </thead>

      <tbody class="body">
        <tr class="row">
          <td class="item" colspan="6"></td>
          <td class="item weekend">01</td>
        </tr>
        <tr class="row">
          <td class="item">02</td>
          <td class="item">03</td>
          <td class="item">04</td>
          <td class="item">05</td>
          <td class="item">06</td>
          <td class="item weekend">07</td>
          <td class="item weekend">08</td>
        </tr>
        <tr class="row">
          <td class="item">09</td>
          <td class="item">10</td>
          <td class="item">11</td>
          <td class="item">12</td>
          <td class="item">13</td>
          <td class="item weekend">14</td>
          <td class="item weekend">15</td>
        </tr>
        <tr class="row">
          <td class="item">16</td>
          <td class="item">17</td>
          <td class="item">18</td>
          <td class="item">19</td>
          <td class="item">20</td>
          <td class="item weekend">21</td>
          <td class="item weekend">22</td>
        </tr>
        <tr class="row">
          <td class="item">23</td>
          <td class="item">24</td>
          <td class="item">25</td>
          <td class="item">26</td>
          <td class="item">27</td>
          <td class="item weekend">28</td>
          <td class="item weekend">29</td>
        </tr>
        <tr class="row">
          <td class="item">30</td>
          <td class="item" colspan="6"></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
